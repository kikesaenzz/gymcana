<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Invitados · Gincana Boda</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 32px 16px;
        }
        main { max-width: 860px; margin: 0 auto; }
        h1 { font-family: 'Playfair Display', serif; font-size: 1.9rem; margin-bottom: 4px; }
        .muted { color: rgba(255,255,255,.55); font-size: .92rem; }
        .stats { display: flex; gap: 12px; margin: 22px 0; flex-wrap: wrap; }
        .stat {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            padding: 14px 22px;
            text-align: center;
            min-width: 130px;
        }
        .stat b { display: block; font-size: 1.7rem; font-weight: 600; }
        .stat span { font-size: .8rem; color: rgba(255,255,255,.55); }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button {
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.18);
            background: #b8956a;
            color: #1a1a2e;
            font-weight: 500;
            cursor: pointer;
        }
        button.secondary { background: rgba(255,255,255,.08); color: #eee; }
        button:hover { filter: brightness(1.08); }
        .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); }
        table { width: 100%; border-collapse: collapse; font-size: .93rem; }
        th, td { padding: 11px 14px; text-align: left; }
        th { background: rgba(255,255,255,.07); font-weight: 500; color: rgba(255,255,255,.7); white-space: nowrap; }
        td { border-top: 1px solid rgba(255,255,255,.07); }
        tr:nth-child(even) td { background: rgba(255,255,255,.03); }
        td.num { text-align: center; }
        #status { margin-top: 14px; }
        .note {
            margin-top: 26px;
            font-size: .85rem;
            color: #d4a5a5;
            background: rgba(212,165,165,.08);
            border: 1px solid rgba(212,165,165,.25);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .empty { padding: 26px; text-align: center; color: rgba(255,255,255,.5); }
    </style>
</head>
<body>
<main>
    <h1>📋 Invitados registrados</h1>
    <p class="muted">Gincana Fotográfica — quién se ha registrado y cuántas fotos ha subido.</p>

    <div class="stats" id="stats"></div>

    <div class="actions">
        <button id="btn-csv">⬇️ Descargar Excel (CSV)</button>
        <button id="btn-reload" class="secondary">🔄 Actualizar</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Registro</th>
                    <th style="text-align:center">Fotos</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="4" class="empty">Cargando…</td></tr>
            </tbody>
        </table>
    </div>

    <p class="muted" id="status"></p>

    <p class="note">⚠️ Esta página no está enlazada desde la web principal. No compartas esta URL: cualquiera con ella puede ver la lista de invitados.</p>
</main>

<script>
    const $ = (s) => document.querySelector(s);

    function normalizeName(s) {
        return String(s || '').trim().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ');
    }

    function escapeHtml(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    let users = [];
    let photos = [];

    function photoCounts() {
        const counts = {};
        photos.forEach(p => {
            const k = normalizeName(p.user);
            if (k) counts[k] = (counts[k] || 0) + 1;
        });
        return counts;
    }

    function fmtDate(iso) {
        if (!iso) return '—';
        try {
            return new Date(iso).toLocaleString('es-ES', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        } catch (e) { return iso; }
    }

    function render() {
        const counts = photoCounts();

        const withPhotos = users.filter(u => counts[normalizeName(u.name)]).length;
        $('#stats').innerHTML = `
            <div class="stat"><b>${users.length}</b><span>Invitados</span></div>
            <div class="stat"><b>${photos.length}</b><span>Fotos subidas</span></div>
            <div class="stat"><b>${withPhotos}</b><span>Con fotos</span></div>
        `;

        if (users.length === 0) {
            $('#tbody').innerHTML = '<tr><td colspan="4" class="empty">Todavía no hay invitados registrados.</td></tr>';
        } else {
            $('#tbody').innerHTML = users.map((u, i) => `
                <tr>
                    <td class="num">${i + 1}</td>
                    <td>${escapeHtml(u.name)}</td>
                    <td>${fmtDate(u.registered)}</td>
                    <td class="num">${counts[normalizeName(u.name)] || 0}</td>
                </tr>
            `).join('');
        }

        // Fotos de alguien que no aparece en el registro (datos antiguos)
        const orphans = Object.keys(counts).filter(k => !users.some(u => normalizeName(u.name) === k));
        $('#status').textContent = orphans.length > 0
            ? `Nota: hay fotos de ${orphans.length} usuario(s) sin registro (aparecen solo en la galería).`
            : '';
    }

    async function load() {
        $('#tbody').innerHTML = '<tr><td colspan="4" class="empty">Cargando…</td></tr>';
        try {
            const [uRes, pRes] = await Promise.all([fetch('/api/users'), fetch('/api/gallery')]);
            users = uRes.ok ? await uRes.json() : [];
            photos = pRes.ok ? await pRes.json() : [];
            if (!Array.isArray(users)) users = [];
            if (!Array.isArray(photos)) photos = [];
            render();
        } catch (e) {
            $('#tbody').innerHTML = '<tr><td colspan="4" class="empty">Error cargando los datos.</td></tr>';
        }
    }

    function downloadCsv() {
        const counts = photoCounts();
        const rows = [['Nombre', 'Registro', 'Fotos']];
        users.forEach(u => {
            rows.push([
                u.name,
                u.registered ? new Date(u.registered).toISOString() : '',
                String(counts[normalizeName(u.name)] || 0)
            ]);
        });
        const csv = '\uFEFF' + rows
            .map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';'))
            .join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'invitados-gincana.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    }

    $('#btn-csv').addEventListener('click', downloadCsv);
    $('#btn-reload').addEventListener('click', load);
    load();
</script>
</body>
</html>
